<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<div th:replace="admin/fragments/head :: head"></div>

<body class="hold-transition skin-blue sidebar-mini">
<div class="wrapper">

    <div th:replace="admin/fragments/header :: header"></div>
    <div th:replace="admin/fragments/sidebar :: sidebar"></div>

    <div class="content-wrapper">

        <section class="content-header">
            <h1>
                Thêm mới bài giảng
                <small>Quản lý bài giảng</small>
            </h1>
            <ol class="breadcrumb">
                <li>
                    <a th:href="@{/admin/dashboard/index}">
                        <i class="fa fa-dashboard"></i> Trang chủ
                    </a>
                </li>
                <li>
                    <a th:href="@{/admin/lesson/index}">Quản lý bài giảng</a>
                </li>
                <li class="active">Thêm mới bài giảng</li>
            </ol>
        </section>

        <section class="content">

            <div class="box box-primary">
                <form th:action="@{/admin/lesson/create}"
                      th:object="${form}"
                      method="post"
                      enctype="multipart/form-data">

                    <div class="box-body">

                        <div class="form-group">
                            <label><span style="color:#dd4b39;">*</span> Mã bài giảng</label>

                            <input type="text"
                                   th:field="*{code}"
                                   class="form-control"
                                   placeholder="Nhập mã bài giảng...">

                            <p class="text-danger"
                               th:if="${#fields.hasErrors('code')}"
                               th:errors="*{code}"></p>
                        </div>

                        <div class="form-group">
                            <label><span style="color:#dd4b39;">*</span> Tên bài giảng</label>
                            <input type="text"
                                   th:field="*{name}"
                                   class="form-control"
                                   placeholder="Nhập tên bài giảng...">

                            <p class="text-danger"
                               th:if="${#fields.hasErrors('name')}"
                               th:errors="*{name}"></p>
                        </div>

                        <div class="form-group">
                            <label><span style="color:#dd4b39;">*</span> Lớp giảng dạy</label>
                            <select th:field="*{grade}" class="form-control">
                                <option value="">-- Chọn lớp giảng dạy --</option>
                                <option th:each="i : ${#numbers.sequence(1,12)}"
                                        th:value="${i}"
                                        th:text="'Lớp ' + ${i}">
                                </option>
                            </select>

                            <p class="text-danger"
                               th:if="${#fields.hasErrors('grade')}"
                               th:errors="*{grade}"></p>
                        </div>

                        <div class="form-group">
                            <label><span style="color:#dd4b39;">*</span> Tháng giảng dạy</label>
                            <select th:field="*{teachingMonth}" class="form-control">
                                <option value="">-- Chọn tháng giảng dạy --</option>
                                <option th:each="i : ${#numbers.sequence(1,12)}"
                                        th:value="${i}"
                                        th:text="'Tháng ' + ${i}">
                                </option>
                            </select>

                            <p class="text-danger"
                               th:if="${#fields.hasErrors('teachingMonth')}"
                               th:errors="*{teachingMonth}"></p>
                        </div>

                        <div class="form-group">
                            <label><span style="color:#dd4b39;">*</span> Mô tả bài giảng</label>
                            <textarea th:field="*{description}"
                                      class="form-control"
                                      rows="4"
                                      placeholder="Mô tả nội dung bài giảng..."></textarea>

                            <p class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
                        </div>

                        <div class="form-group">
                            <label><span style="color:#dd4b39;">*</span> Ảnh bìa bài giảng</label>
                            <input type="file"
                                   th:field="*{coverFile}"
                                   accept="image/*"
                                   class="form-control">
                        </div>

                    </div>

                    <div class="box-footer">
                        <button type="submit" class="btn btn-primary">
                            <i class="fa fa-save"></i> Lưu bài giảng
                        </button>

                        <a th:href="@{/admin/lesson/index}"
                           class="btn btn-default">
                            <i class="fa fa-arrow-left"></i> Quay lại
                        </a>
                    </div>

                </form>
            </div>

        </section>
    </div>
</div>

<div th:replace="admin/fragments/script :: script"></div>
<div th:replace="admin/fragments/notify-toastify :: notify-toastify"></div>

</body>
</html>
