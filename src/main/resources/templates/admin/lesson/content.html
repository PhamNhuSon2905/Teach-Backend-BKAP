<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<div th:replace="admin/fragments/head :: head"></div>

<body class="hold-transition skin-blue sidebar-mini">
<div class="wrapper">

    <div th:replace="admin/fragments/header :: header"></div>
    <div th:replace="admin/fragments/sidebar :: sidebar"></div>

    <div class="content-wrapper">
        <section class="content-header">
            <h1>
                Nội dung bài giảng
                <small th:text="${lesson.name}"></small>
            </h1>
            <ol class="breadcrumb">
                <li>
                    <a th:href="@{/admin/dashboard/index}">
                        <i class="fa fa-dashboard"></i> Trang chủ
                    </a>
                </li>
                <li class="active">Nội dung các tệp bài giảng</li>
            </ol>
        </section>
        <section class="content">

            <div class="box box-primary">
                <div class="box-header with-border">
                    <h3 class="box-title">
                        <i class="fa fa-upload"></i> Tải lên bài giảng
                    </h3>
                </div>

                <form th:action="@{/admin/lesson/{id}/content(id=${lesson.id})}"
                      method="post"
                      enctype="multipart/form-data" th:object="${uploadForm}">

                    <div class="box-body">
                        <div class="form-group">
                            <label>Chọn tệp tại đây</label>
                            <span style="color:#dd4b39;">*</span>
                            <input type="file" th:field="*{file}" class="form-control">
                        </div>
                    </div>

                    <div class="box-footer text-right">
                        <button type="submit" class="btn btn-primary">
                            <i class="fa fa-cloud-upload"></i> Tải lên
                        </button>

                        <a th:href="@{/admin/lesson/{id}(id=${lesson.id})}"
                           class="btn btn-info">
                            <i class="fa fa-eye"></i> Xem chi tiết
                        </a>

                        <a th:href="@{/admin/lesson/index}"
                           class="btn btn-default">
                            <i class="fa fa-arrow-left"></i> Quay lại
                        </a>
                    </div>

                </form>
            </div>

            <div class="box box-info">
                <div class="box-header with-border">
                    <h3 class="box-title">
                        <i class="fa fa-folder-open"></i> Danh sách thư mục & tệp hiện có
                    </h3>
                </div>

                <div class="box-body table-responsive">
                    <table class="table table-bordered table-hover">
                        <thead>
                        <tr>
                            <th>Tên tệp bài giảng</th>
                            <th>Loại tệp đã tải lên</th>
                            <th>Dung lượng tệp</th>
                            <th>Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="f : ${files}">
                            <td>
                                <i class="fa fa-file-text-o"></i> <span th:text="${f.fileName}"></span>
                            </td>
                            <td th:text="${f.fileType}"></td>
                            <td th:text="${@fileSize.readable(f.fileSize)}"></td>
                            <td>
                                <form th:action="@{/admin/lesson/content/file/{id}/delete(id=${f.id})}"
                                      method="post"
                                      onsubmit="return confirm('Xoá tài liệu giảng dạy này?')">

                                    <input type="hidden" name="lessonId" th:value="${lesson.id}"/>

                                    <button class="btn btn-danger btn-xs">
                                        <i class="fa fa-trash"></i> Xoá tài liệu
                                    </button>
                                </form>
                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(files)}">
                            <td colspan="3" class="text-center text-muted">
                                Chưa có thư mục & tệp nào được tải lên cho bài giảng này !
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </section>
    </div>
</div>

<div th:replace="admin/fragments/script :: script"></div>
<div th:replace="admin/fragments/notify-toastify :: notify-toastify"></div>

</body>
</html>
