<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="utf-8">
    <title>Đăng ký quản trị</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" th:href="@{/assets/favicon/logo_BKAP.ico}"/>
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/AdminLTE.css}">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
    <link rel="stylesheet" th:href="@{/assets/vendor/toastify/css/toastify.css}">
</head>

<body class="hold-transition login-page">
<div class="container">
    <div class="login-box">
        <div class="login-box-body">
            <p class="login-box-msg">Đăng ký quản trị</p>


            <form th:action="@{/admin/auth/register}" method="post" th:object="${adminRegisterRequest}">
                <div class="form-group">
                    <label for="username"><span style="color:#dd4b39;">*</span> Tên người dùng</label>
                    <input type="text" id="username" class="form-control" placeholder="Nhập tên người dùng..."
                           th:field="*{username}">
                    <div class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>

                <div class="form-group">
                    <label for="email"><span style="color:#dd4b39;">*</span> Email</label>
                    <input type="email" id="email" class="form-control" placeholder="Nhập địa chỉ email..."
                           th:field="*{email}">
                    <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="form-group">
                    <label for="password"><span style="color:#dd4b39;">*</span> Mật khẩu</label>
                    <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu..."
                           th:field="*{password}">
                    <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <div class="form-group">
                    <label for="fullname"><span style="color:#dd4b39;">*</span> Họ và tên</label>
                    <input type="text" id="fullname" class="form-control" placeholder="Nhập họ và tên..."
                           th:field="*{fullname}">
                    <div class="error" th:if="${#fields.hasErrors('fullname')}" th:errors="*{fullname}"></div>
                </div>

                <div class="form-group">
                    <label for="phone"><span style="color:#dd4b39;">*</span> Số điện thoại</label>
                    <input type="text" id="phone" class="form-control" placeholder="Nhập số điện thoại..."
                           th:field="*{phone}">
                    <div class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                </div>

                <div class="form-group">
                    <label for="address"><span style="color:#dd4b39;">*</span> Địa chỉ</label>
                    <input type="text" id="address" class="form-control" placeholder="Nhập địa chỉ..."
                           th:field="*{address}">
                    <div class="error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                </div>


                <button type="submit" class="btn btn-success btn-block">Đăng ký tài khoản</button>
            </form>

            <p class="text-center" style="margin-top: 15px;">
                Đã có tài khoản? <a th:href="@{/admin/auth/login}">Đăng nhập tại đây</a>
            </p>
        </div>
    </div>
</div>
</body>
<script th:src="@{/assets/vendor/toastify/js/toastify.js}"></script>
<th:block th:replace="admin/fragments/notify-toastify :: notify-toastify"></th:block>
</html>
