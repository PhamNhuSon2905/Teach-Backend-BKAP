<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<div th:replace="admin/fragments/head :: head"></div>
<body class="hold-transition skin-blue sidebar-mini">
<div class="wrapper">

    <div th:replace="admin/fragments/header :: header"></div>
    <div th:replace="admin/fragments/sidebar :: sidebar"></div>

    <div class="content-wrapper">
        <section class="content-header">
            <h1 style="margin-left: 10px;">Chỉnh sửa hồ sơ</h1>
            <ol class="breadcrumb">
                <li><a th:href="@{/admin/dashboard/index}"><i class="fa fa-dashboard"></i> Trang chủ</a></li>
                <li><a th:href="@{/admin/profile}">Hồ sơ</a></li>
                <li class="active">Chỉnh sửa</li>
            </ol>
        </section>

        <section class="content">
            <form th:action="@{/admin/profile/edit}" method="post" enctype="multipart/form-data"
                  th:object="${adminProfileRequest}">
                <div class="box box-primary">
                    <div class="box-body">

                        <div class="form-group">
                            <label><span style="color:#dd4b39;">*</span> Họ và tên:</label>
                            <input type="text" th:field="*{fullname}" class="form-control" placeholder="Họ và tên">
                            <div class="text-danger" th:if="${#fields.hasErrors('fullname')}"
                                 th:errors="*{fullname}"></div>
                        </div>

                        <div class="form-group">
                            <label><span style="color:#dd4b39;">*</span> Địa chỉ email:</label>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="Địa chỉ email...">
                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}">
                            </div>
                        </div>


                        <div class="form-group">
                            <label><span style="color:#dd4b39;">*</span> Số điện thoại:</label>
                            <input type="text" th:field="*{phone}" class="form-control" placeholder="Số điện thoại...">
                            <div class="text-danger" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                        </div>

                        <div class="form-group">
                            <label><span style="color:#dd4b39;">*</span> Địa chỉ:</label>
                            <input type="text" th:field="*{address}" class="form-control" placeholder="Địa chỉ...">
                            <div class="text-danger" th:if="${#fields.hasErrors('address')}"
                                 th:errors="*{address}"></div>
                        </div>

                        <div class="form-group">
                            <label>
                                <span style="color:#dd4b39;">*</span> Chọn ảnh đại diện mới:
                            </label>

                            <input type="file" name="avatarFile" class="form-control">


                            <p style="margin-top:5px;color:#999;font-size:13px;">
                                <i class="fa fa-info-circle"></i>
                                Vui lòng dùng ảnh <b>128 × 128</b> để hiển thị chân dung đẹp nhất
                            </p>

                            <div class="text-danger"
                                 th:if="${avatarError}"
                                 th:text="${avatarError}">
                            </div>
                        </div>


                        <div class="form-group">
                            <label>Ảnh đại diện hiện tại:</label><br>
                            <img th:src="${#strings.isEmpty(user.avatar) ? '/assets/images/default_admin.jpg' : user.avatar}"
                                 class="img-thumbnail"
                                 style="width: 150px; height: 150px;"/>
                        </div>


                        <div class="text-center">
                            <button type="submit" class="btn btn-success">Lưu thay đổi</button>
                            <a th:href="@{/admin/profile}" class="btn btn-default">Hủy bỏ</a>
                        </div>

                    </div>
                </div>
            </form>
        </section>
    </div>

</div>
<div th:replace="admin/fragments/script :: script"></div>
<div th:replace="admin/fragments/notify-toastify :: notify-toastify"></div>
</body>
</html>
